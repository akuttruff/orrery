<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Full-bleed opaque ground: iOS masks to its own squircle. -->
  <rect width="512" height="512" fill="#444444"/>
  <!-- An orrery seen from above: the Sun, three orbits, three planets. -->
  <g fill="none" stroke="#FFFFFF" stroke-width="7">
    <circle cx="256" cy="256" r="92" opacity="0.55"/>
    <circle cx="256" cy="256" r="150" opacity="0.7"/>
    <circle cx="256" cy="256" r="208"/>
  </g>
  <circle cx="256" cy="256" r="30" fill="#3D92C9"/>
  <circle cx="256" cy="164" r="13" fill="#FFFFFF"/>
  <circle cx="128" cy="334" r="17" fill="#DDDDDD"/>
  <circle cx="403" cy="376" r="21" fill="#B0CADB"/>
</svg>
